server:
  port: 7382
  shutdown: graceful
spring:
  application:
    name: user-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
services:
  accounting:
    url: http://localhost:7384
