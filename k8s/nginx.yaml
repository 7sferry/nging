apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: nging
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        include       mime.types;
        default_type  application/octet-stream;

        # Rate limiting zones (per client IP)
        limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
        limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

        # Return JSON on rate limit (429)
        limit_req_status 429;

        map $uri $no_cache {
            ~^/api/  "no-store";
            default  "";
        }

        upstream auth_service {
            server auth-service.nging.svc.cluster.local:8080;
        }

        upstream user_service {
            server user-service.nging.svc.cluster.local:8080;
        }

        upstream accounting_service {
            server accounting-service.nging.svc.cluster.local:8080;
        }

        server {
            listen 9090;

            add_header Cache-Control $no_cache always;

            # Custom 429 error response
            error_page 429 = @rate_limited;
            location @rate_limited {
                default_type application/json;
                return 429 '{"error": "Too many requests. Please try again later."}';
            }

            location = /_validate {
                internal;
                proxy_pass http://auth_service/auth/validate;
                proxy_http_version 1.1;
                proxy_method GET;
                proxy_pass_request_body off;
                proxy_set_header Content-Length "0";
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                proxy_set_header Transfer-Encoding "";
                proxy_set_header Authorization $http_authorization;
            }

            # Health check endpoints (no auth required)
            location = /api/health/auth {
                proxy_pass http://auth_service/actuator/health;
                proxy_set_header Host $host;
            }

            location = /api/health/user {
                proxy_pass http://user_service/actuator/health;
                proxy_set_header Host $host;
            }

            location = /api/health/accounting {
                proxy_pass http://accounting_service/actuator/health;
                proxy_set_header Host $host;
            }

            location /api/auth/ {
                limit_req zone=api_auth burst=10 nodelay;

                proxy_pass http://auth_service/auth/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/users/ {
                limit_req zone=api_general burst=40 nodelay;

                auth_request /_validate;
                auth_request_set $auth_user $upstream_http_x_auth_user;
                auth_request_set $auth_client_id $upstream_http_x_auth_client_id;
                auth_request_set $auth_roles $upstream_http_x_auth_roles;
                auth_request_set $auth_work_entities $upstream_http_x_auth_work_entities;

                proxy_pass http://user_service/users/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Auth-User $auth_user;
                proxy_set_header X-Auth-Client-Id $auth_client_id;
                proxy_set_header X-Auth-Roles $auth_roles;
                proxy_set_header X-Auth-Work-Entities $auth_work_entities;
                proxy_set_header Authorization $http_authorization;
            }

            location /api/contacts/ {
                limit_req zone=api_general burst=40 nodelay;

                auth_request /_validate;
                auth_request_set $auth_user $upstream_http_x_auth_user;

                proxy_pass http://user_service/contacts/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Authorization $http_authorization;
            }

            location /api/accounts/ {
                limit_req zone=api_general burst=40 nodelay;

                auth_request /_validate;
                auth_request_set $auth_user $upstream_http_x_auth_user;
                auth_request_set $auth_client_id $upstream_http_x_auth_client_id;
                auth_request_set $auth_roles $upstream_http_x_auth_roles;
                auth_request_set $auth_work_entities $upstream_http_x_auth_work_entities;

                proxy_pass http://accounting_service/accounts/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Auth-User $auth_user;
                proxy_set_header X-Auth-Client-Id $auth_client_id;
                proxy_set_header X-Auth-Roles $auth_roles;
                proxy_set_header X-Auth-Work-Entities $auth_work_entities;
                proxy_set_header Authorization $http_authorization;
            }

            location /api/ {
                return 404 '{"error": "Not found"}';
                add_header Content-Type application/json always;
            }

            location ~* \.html$ {
                root /usr/share/nginx/html;
                add_header Cache-Control "no-cache" always;
            }

            location ~* \.(css|js)$ {
                root /usr/share/nginx/html;
                add_header Cache-Control "public, max-age=3600, must-revalidate" always;
            }

            location / {
                root /usr/share/nginx/html;
                index login.html;
                try_files $uri $uri/ /login.html;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: nging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nging/nginx:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: nging
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
