apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: nging
data:
  init-db.sql: |
    CREATE TABLE IF NOT EXISTS user_session (
        id              BIGSERIAL PRIMARY KEY,
        username        VARCHAR(255) NOT NULL,
        token_hash      VARCHAR(64)  NOT NULL UNIQUE,
        rotate_at       TIMESTAMP    NOT NULL,
        expires_at      TIMESTAMP    NOT NULL,
        created_at      TIMESTAMP    NOT NULL,
        invalidated     BOOLEAN      NOT NULL DEFAULT FALSE
    );

    CREATE INDEX IF NOT EXISTS idx_token_hash ON user_session (token_hash);
    CREATE INDEX IF NOT EXISTS idx_username ON user_session (username);
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nging
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nging
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: nging-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nging-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nging-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
