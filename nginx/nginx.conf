events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Disable browser caching for all /api/ responses
    map $uri $no_cache {
        ~^/api/  "no-store";
        default  "";
    }

    server {
        listen 9090;

        # Apply to all responses — works even with auth_request locations
        add_header Cache-Control $no_cache always;

        # Internal auth validation endpoint — called by auth_request
        location = /_validate {
            internal;
            proxy_pass http://127.0.0.1:7381/auth/validate;
            proxy_http_version 1.1;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "0";
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Transfer-Encoding "";
            proxy_set_header Authorization $http_authorization;
        }

        # Auth service — login, refresh, logout (no JWT required)
        location /api/auth/ {
            proxy_pass http://127.0.0.1:7381/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # User service — protected, JWT validated by gateway
        location /api/users/ {
            auth_request /_validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_client_id $upstream_http_x_auth_client_id;
            auth_request_set $auth_roles $upstream_http_x_auth_roles;
            auth_request_set $auth_work_entities $upstream_http_x_auth_work_entities;

            proxy_pass http://127.0.0.1:7382/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User $auth_user;
            proxy_set_header X-Auth-Client-Id $auth_client_id;
            proxy_set_header X-Auth-Roles $auth_roles;
            proxy_set_header X-Auth-Work-Entities $auth_work_entities;
            proxy_set_header Authorization $http_authorization;

        }

        # User contacts — protected, JWT validated by gateway
        location /api/contacts/ {
            auth_request /_validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;

            proxy_pass http://127.0.0.1:7382/contacts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

        }

        # Accounting service — protected, JWT validated by gateway
        location /api/accounts/ {
            auth_request /_validate;
            auth_request_set $auth_user $upstream_http_x_auth_user;
            auth_request_set $auth_client_id $upstream_http_x_auth_client_id;
            auth_request_set $auth_roles $upstream_http_x_auth_roles;
            auth_request_set $auth_work_entities $upstream_http_x_auth_work_entities;

            proxy_pass http://127.0.0.1:7384/accounts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Auth-User $auth_user;
            proxy_set_header X-Auth-Client-Id $auth_client_id;
            proxy_set_header X-Auth-Roles $auth_roles;
            proxy_set_header X-Auth-Work-Entities $auth_work_entities;
            proxy_set_header Authorization $http_authorization;

        }

        # Catch-all for unmatched API routes — return 404, not login.html
        location /api/ {
            return 404 '{"error": "Not found"}';
            add_header Content-Type application/json always;
        }

        # Static HTML — always revalidate with server
        location ~* \.html$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache" always;
        }

        # Static CSS/JS — cache 1 hour, revalidate using ETag
        location ~* \.(css|js)$ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        }

        # Static UI — catch-all
        location / {
            root /usr/share/nginx/html;
            index login.html;
            try_files $uri $uri/ /login.html;
        }
    }
}
