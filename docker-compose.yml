services:
  nginx:
    image: nginx:alpine
    container_name: nging-gateway
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro

